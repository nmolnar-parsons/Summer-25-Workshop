<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart</title>

    <style>
        body {
            font-family: sans-serif;
        }

        #app {
            padding: 20px;
        }

        #title {
            padding-bottom:10px;
        }

        h1 {
            font-size: 1.2rem;
        }

        #container2 {
            margin-top: 20px;
        }

        #container3 {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="title">
            <h1>Bar Chart</h1>
        </div>
        <div id="container"></div>
        <div id="container2"></div>
        <div id="container3"></div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="text/javascript">
        const container = d3.select('#container');
        const container2 = d3.select('#container2');
        const container3 = d3.select('#container3');

        const height = 500;
        const width = 600;

        const dataset = {
            "Category A": 5,
            "Category B": 3,
            "Category C": 8
        }

        const data_array = Object.entries(dataset)

        const symbols = {
            "Category A": "#",
            "Category B": "*",
            "Category C": "•"
        }
        const chart = container
            .append('svg')
            .style('max-width', '30em')
            .attr('viewBox', [0,0, width, height]) // set the viewBox to control the size of the SVG
            .attr('width', width)
            .attr('height', height)
          //  .style('border', '1px solid black'); 

        // something about xScale and yScale are not working 
        // need to do object.entries(dataset) to get the keys and values 

        const xScale = d3
            .scaleBand()
            .domain(Object.keys(dataset))
            .range([0, width])
            .paddingInner(0.1)
            .paddingOuter(0.1);

        const yScale = d3
            .scaleLinear()
            .domain([0, d3.max(Object.values(dataset))])
            .range([height, 0]); 

        const colorScale = d3
            .scaleOrdinal()
            .domain(Object.keys(symbols))
            .range(d3.schemeTableau10);

        // create y-axis
        var yAxis = d3.axisLeft(yScale)

        // create bottom axis
        var xAxis = d3.axisBottom(xScale)
        
        // add a margin?
        var margin = {left :40, right: 40, top : 0, bottom: 0};

        // group for margin and chart
        var chartGroup = chart.append("g")
            .attr("transform", "translate("+margin.left+", "+margin.top+")");


        chartGroup.selectAll('rect').data(data_array).join('rect')
            .attr("width", () => xScale.bandwidth())
            .attr("height", (d) => height - yScale(d[1])) // d[1] is the value 
            .attr('x', (d) => xScale(d[0]))
            .attr("y", (d) => yScale(d[1]))
            .attr('fill', (d) => colorScale(d[1]))
           

        chartGroup.append("g").attr('class', 'axis y')
            .call(yAxis); // keep axis and chart together - no independent transforms
            
        chartGroup.append("g").attr('class', 'axis x')
            .attr("transform", "translate(0," + height + ")") // move the x-axis to the bottom
            .call(xAxis);


        //create color Scale

        // add rectangles to svg in chart
            // selectAll rectanlges
            // .data
            // .join()
            // set x, y, w, h attributes
            // set fill attribute with scale



    </script>
</body>
</html>
