  <script type="text/javascript">
    function truncate_string(str,n){
      //substring inputted string by n 
      return str.substring(str,n)
    }

    function string_parameterize(str){
      // make string lowercase with .toLowerCase
      // replace spaces with dashes
      var mystring = str.replace(/\s+/g,"-").toLowerCase()
      return mystring
    }

    function sum_of_odd_numbers(i,j){
      // for i in range X to Y -->
        // if i/2 = integer -->
        // x + i -->
        // else do nothing-->
      let counter = 0 
      for (let k = i; k <=j;  k++){
        if (k % 2 != 0) {
          counter += k;
        }
      }
      return counter
    }

    function celcius_to_fahrenheit(i){
      return i*(9/5) + 32
    }

    function sum_of_array(arr){
      // for i in arr-->
        // x =+ arr[i]-->
      let sum = 0
      for (let i = 0; i < arr.length; i++){
        sum += arr[i];
      }
      return sum
    }

    function mean_of_array(arr){
      // var length = length(arr)-->
      // for i in arr-->
        // x =+ arr[i]-->
      let sum = 0
      for (let i = 0; i < arr.length; i++){
        sum += arr[i];
      }
      return sum/arr.length
    }

    function only_positive(arr){
      // take positive values out of the old array and add them into a new array-->
        // use for loop to check each value of old array-->
      // return new array-->
      let myArray = []
      for (let i = 0; i < arr.length; i++){
        if (Math.sign(arr[i]) == 1) {
          myArray.push(arr[i]);
        }
      }
      return myArray
    }

      //return boolean
      return str == str.split("").reverse().join("")
